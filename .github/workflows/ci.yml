name: Notify Dev EDA

on:
  push:
    branches:
      - dev
      - main

jobs:
  notify-dev-eda:
    runs-on: ubuntu-latest
    env:
      TARGET_EDA_URL: ${{ secrets.EDA_DEV_URL }}
      EDA_WEBHOOK: ${{ secrets.EDA_DEV_TOKEN }}
    steps:
      - name: Send Notification
        run: |
          # 1. Define the exact JSON payload
          PAYLOAD=$(cat <<EOF
          {
            "object_kind": "push",
            "gitlab_project_branch": "${{ github.ref_name }}",
            "gitlab_project_name": "${{ github.event.repository.name }}",
            "gitlab_project_url": "${{ github.event.repository.html_url }}.GIT",
            "gitlab_user_email": "${{ github.event.head_commit.author.email }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          )
          
          # 2. Generate the HMAC-SHA256 signature using your secret
          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$EDA_WEBHOOK" | awk '{print $NF}')
          
          # 3. Send the request with the signature header instead of the raw token
          curl -k -v -X POST "$TARGET_EDA_URL" \
            -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
